# This is a Declarative Automation Bundle definition for NovaCart_Data_Platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: NovaCart_Data_Platform
  uuid: d3566d20-f5ae-4d00-8e04-7301cbf76ee7

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616017154156.16.azuredatabricks.net
    variables:
      catalog: dbw_novacart_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405616017154156.16.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/shkurtiedda@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shkurtiedda@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbw_novacart_dev
      schema: prod
    permissions:
      - user_name: shkurtiedda@gmail.com
        level: CAN_MANAGE
